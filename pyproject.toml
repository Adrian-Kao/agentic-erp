[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[project]
name = "erp-agent"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2", "fastapi>=0.115,<1", "httpx>=0.28,<1",
  "mcp>=2,<3", "openai-agents>=0.17,<1", "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "pyyaml>=6,<7",
  "openpyxl>=3.1,<4", "defusedxml>=0.7,<1", "pymysql[rsa]>=1.1,<2",
  "sqlalchemy>=2.0.36,<2.1", "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["httpx2>=2,<3", "mypy>=1.15,<3", "pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1", "types-pyyaml"]

[tool.hatch.build.targets.wheel]
packages = ["src/erp_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
exclude = ["ERP_AGENT_CODEX_IMPLEMENTATION.md", "ERP_AGENT_FINANCEBENCHMARK_MYSQL_CODEX.md", "data"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["openpyxl.*", "defusedxml.*"]
ignore_missing_imports = true
